<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diwali Rooftop Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #020106;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Locked Mobile Frame Container */
        #appContainer {
            position: relative;
            aspect-ratio: 9 / 16;
            height: 100vh;
            max-width: 100vw;
            width: auto;
            overflow: hidden;
            background: #05040a;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        @media (max-aspect-ratio: 9/16) {
            #appContainer {
                width: 100vw;
                height: auto;
                aspect-ratio: 9 / 16;
            }
        }

        /* Top HUD Bar */
        #topHud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 60;
            pointer-events: none;
        }

        .hud-badge {
            background: rgba(15, 8, 25, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 18px;
            padding: 5px 12px;
            color: #ffd700;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-badge span.eco-tag {
            color: #00e676;
        }

        .hud-actions {
            pointer-events: auto;
            display: flex;
            gap: 8px;
        }

        .hud-btn {
            background: rgba(15, 8, 25, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            transition: transform 0.2s;
        }

        .hud-btn:active {
            transform: scale(0.9);
        }

        /* Direct On-Screen "Name in Sky" Input Bar */
        #skyNameBar {
            position: absolute;
            top: 56px;
            left: 14px;
            right: 14px;
            display: flex;
            gap: 6px;
            z-index: 60;
            background: rgba(15, 8, 25, 0.88);
            border: 1px solid rgba(255, 215, 0, 0.5);
            padding: 5px 6px 5px 14px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        #skyNameInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        #skyNameInput::placeholder {
            color: rgba(255, 240, 200, 0.6);
            font-size: 11px;
        }

        .sky-fire-btn {
            background: linear-gradient(135deg, #ffd700, #ff8800);
            border: none;
            color: #000;
            font-weight: 600;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(255, 170, 0, 0.4);
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .sky-fire-btn:active {
            transform: scale(0.93);
        }

        /* Floating Interactive Action Buttons */
        .interactive-sidebar {
            position: absolute;
            right: 12px;
            top: 104px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 60;
        }

        .side-action-btn {
            background: rgba(20, 10, 35, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #ffd700;
            border-radius: 20px;
            padding: 7px 11px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.25);
            transition: transform 0.2s;
        }

        .side-action-btn:active {
            transform: scale(0.92);
        }

        /* Developer Credit Text */
        .dev-credit {
            font-size: 11px;
            color: rgba(255, 235, 180, 0.7);
            margin-top: 14px;
            letter-spacing: 0.8px;
        }

        .dev-credit span {
            color: #ffd700;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        /* 1. Entry Popup */
        #entryModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(30, 15, 45, 0.94) 0%, rgba(4, 2, 10, 0.98) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .popup-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(255, 75, 43, 0.04) 100%);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 28px;
            padding: 35px 22px 24px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 170, 0, 0.35), inset 0 0 25px rgba(255, 215, 0, 0.1);
            width: 88%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: cardFloat 3.5s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); box-shadow: 0 0 40px rgba(255, 170, 0, 0.3); }
            100% { transform: translateY(-8px); box-shadow: 0 10px 55px rgba(255, 170, 0, 0.45); }
        }

        .diya-container {
            position: relative;
            width: 60px;
            height: 50px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diya-flame {
            position: absolute;
            top: -2px;
            width: 16px;
            height: 26px;
            background: linear-gradient(to top, #ff3700, #ffbb00, #ffffff);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px #ff9900, 0 0 35px #ff4400;
            animation: flameFlicker 1.4s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
            50% { transform: scale(1.08, 0.95) rotate(3deg); opacity: 1; }
            100% { transform: scale(0.96, 1.05) rotate(-1deg); opacity: 0.9; }
        }

        .diya-base {
            position: absolute;
            bottom: 4px;
            width: 52px;
            height: 20px;
            background: linear-gradient(180deg, #d48816, #7a3e00);
            border-radius: 0 0 26px 26px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border-top: 2px solid #ffd700;
        }

        #senderGreeting {
            font-size: 13px;
            color: #ffd700;
            margin-bottom: 6px;
            font-weight: 600;
            display: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .popup-card h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #ffd700 40%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.7));
        }

        .popup-card p.subtitle {
            font-size: 11px;
            color: rgba(255, 240, 200, 0.85);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 18px;
            text-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
        }

        .celebrate-btn {
            position: relative;
            background: linear-gradient(135deg, #ff9000 0%, #ff3b00 100%);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 75, 43, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 120, 0, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(255, 120, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 120, 0, 0); }
        }

        .celebrate-btn:active {
            transform: scale(0.94);
        }

        /* 2. Inactivity Tooltip */
        #idlePrompt {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(15, 8, 25, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.7);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            white-space: nowrap;
        }

        #idlePrompt.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: bounceTip 1.8s infinite alternate;
        }

        @keyframes bounceTip {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(8px); }
        }

        /* 3. Wishes & Share Modal */
        #wishesModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(30, 8, 40, 0.96) 0%, rgba(4, 2, 10, 0.98) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #wishesModal.active {
            display: flex;
            opacity: 1;
        }

        .wishes-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 50, 0, 0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 28px;
            padding: 26px 20px 20px;
            text-align: center;
            width: 90%;
            max-width: 330px;
            box-shadow: 0 0 45px rgba(255, 180, 0, 0.35);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .wishes-card h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            background: linear-gradient(180deg, #fff, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .eco-unlocked {
            font-size: 11px;
            color: #00e676;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-button-stack {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 12px;
        }

        .whatsapp-share-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 4px 18px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s;
            cursor: pointer;
            width: 100%;
            border: none;
        }

        .download-card-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #000;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 4px 18px rgba(255, 215, 0, 0.35);
            transition: transform 0.2s;
            cursor: pointer;
            width: 100%;
            border: none;
        }

        .whatsapp-share-btn:active, .download-card-btn:active {
            transform: scale(0.96);
        }

        .replay-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 7px 16px;
            font-size: 11px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .replay-btn:hover {
            color: #ffd700;
            border-color: #ffd700;
        }

        /* 4. Main Stage */
        #rooftopScene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            background: #000;
        }

        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
            pointer-events: none;
        }

        #fuljhuriVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 45;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        #fuljhuriVideo.active {
            display: block;
            opacity: 1;
        }

        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 20;
            display: block;
        }

        /* 5. Rooftop Items Layer */
        .rooftop-items {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .item {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .item:active {
            transform: scale(0.92) !important;
            filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.9));
        }

        #item-bomb {
            bottom: 21%;
            left: 27%;
            width: 52px;
            height: 52px;
        }

        #item-tubri {
            bottom: 16%;
            left: 38%;
            width: 58px;
            height: 68px;
        }

        #item-skyshot {
            bottom: 24%;
            left: 49%;
            width: 44px;
            height: 95px;
        }

        #item-rocket {
            bottom: 23%;
            left: 63%;
            width: 55px;
            height: 125px;
            transform: rotate(-7deg);
        }

        #item-chorki {
            bottom: 12%;
            left: 51%;
            width: 68px;
            height: 48px;
            transform: rotateX(48deg);
        }

        #item-fuljhuri {
            bottom: 16%;
            left: 74%;
            width: 62px;
            height: 72px;
            transform: rotate(-12deg);
        }
    </style>
</head>
<body>

    <div id="appContainer">

        <!-- Top HUD Bar -->
        <div id="topHud">
            <div class="hud-badge">
                <span id="crackerScore">💥 0/6 Burst</span>
                <span style="color: rgba(255,255,255,0.3);">|</span>
                <span class="eco-tag">🌿 0% Smoke</span>
            </div>
            <div class="hud-actions">
                <button class="hud-btn" onclick="downloadSnapshotCard()" title="Download Greeting Card">📸</button>
                <button class="hud-btn" id="muteBtn" onclick="toggleAudioMute()" title="Mute/Unmute">🔊</button>
            </div>
        </div>

        <!-- Direct "Name in Sky" Firework Bar -->
        <div id="skyNameBar">
            <input type="text" id="skyNameInput" placeholder="Type name for Sky Firework...">
            <button class="sky-fire-btn" onclick="fireCustomNameSky()">Fire ✨</button>
        </div>

        <!-- Floating Interactive Sidebar (Fanush & Dhamaka Mode) -->
        <div class="interactive-sidebar">
            <button class="side-action-btn" onclick="launchSkyLantern()">🏮 Release Fanush</button>
            <button class="side-action-btn" onclick="triggerGrandFinale()">🎆 Dhamaka Mode</button>
        </div>

        <!-- Inactivity Tooltip -->
        <div id="idlePrompt">✨ Tap on any firecracker to burst! 🪔</div>

        <!-- 1. Entry Popup -->
        <div id="entryModal">
            <div class="popup-card">
                <div class="diya-container">
                    <div class="diya-flame"></div>
                    <div class="diya-base"></div>
                </div>
                <div id="senderGreeting"></div>
                <h1>Happy Diwali</h1>
                <p class="subtitle">✨ Pollution Free Rooftop Celebration ✨</p>
                <button class="celebrate-btn" onclick="startCelebration()">Let's Celebrate 🪔</button>
                <div class="dev-credit">Crafted with ❤️ by <span>DevilRexxx</span></div>
            </div>
        </div>

        <!-- 2. Final Personalized Wishes & Card Download Modal -->
        <div id="wishesModal">
            <div class="wishes-card">
                <div style="font-size: 36px; margin-bottom: 4px;">🏆🪔✨</div>
                <h2>Shubh Deepavali!</h2>
                <div class="eco-unlocked">🌿 Eco-Friendly Champion Badge Unlocked!</div>

                <div class="action-button-stack">
                    <a id="whatsappBtn" class="whatsapp-share-btn" target="_blank" href="#">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.085-1.924-.457-1.579-.663-2.6-2.264-2.678-2.368-.078-.105-.644-.86-.644-1.644 0-.783.405-1.171.55-1.332.144-.162.313-.203.418-.203.104 0 .209.002.302.007.103.006.241-.039.373.286.136.335.47 1.146.512 1.23.042.084.07.182.014.293-.056.111-.084.18-.168.279-.084.098-.176.22-.251.296-.084.084-.171.176-.073.344.098.169.434.717.933 1.161.643.571 1.184.748 1.353.832.169.084.269.074.37-.042.102-.116.438-.51.554-.686.116-.176.233-.147.393-.088.16.059 1.018.48 1.193.568.175.088.293.131.336.205.043.075.043.435-.101.84z"/>
                        </svg>
                        Share Wish on WhatsApp
                    </a>
                    <button class="download-card-btn" onclick="downloadSnapshotCard()">
                        📸 Save Diwali Card Image
                    </button>
                </div>

                <button class="replay-btn" onclick="resetCelebration()">Play Again 🔄</button>
                <div class="dev-credit">Developed by <span>DevilRexxx</span></div>
            </div>
        </div>

        <!-- 3. Rooftop Scene -->
        <div id="rooftopScene">
            <video id="bgVideo" autoplay muted loop playsinline preload="auto">
                <source src="https://raw.githubusercontent.com/DevilRexxx/Diwali/main/286239650_1793388359038343.mp4" type="video/mp4">
            </video>

            <!-- Fuljhuri Video Overlay -->
            <video id="fuljhuriVideo" playsinline preload="auto">
                <source src="https://raw.githubusercontent.com/DevilRexxx/Diwali/2fd8435359cc95089f859f88955e6121e40202e5/605670983_1793538047166326.mp4" type="video/mp4">
            </video>

            <canvas id="fxCanvas"></canvas>

            <!-- Firecrackers Layer -->
            <div class="rooftop-items" id="crackersContainer">
                <div class="item" id="item-bomb" onclick="handleCrackerClick('bomb')">
                    <img src="https://iili.io/nSabpvs.md.png" alt="Bomb">
                </div>

                <div class="item" id="item-tubri" onclick="handleCrackerClick('tubri')">
                    <img src="https://iili.io/nSaQVb2.md.png" alt="Tubri">
                </div>

                <div class="item" id="item-skyshot" onclick="handleCrackerClick('skyshot')">
                    <img src="https://iili.io/nSaLW6g.md.png" alt="Sky Shot">
                </div>

                <div class="item" id="item-rocket" onclick="handleCrackerClick('rocket')">
                    <img src="https://iili.io/nSapSea.md.png" alt="Rocket">
                </div>

                <div class="item" id="item-chorki" onclick="handleCrackerClick('chorki')">
                    <img src="https://iili.io/nSamYcF.md.png" alt="Chorki">
                </div>

                <div class="item" id="item-fuljhuri" onclick="handleCrackerClick('fuljhuri')">
                    <img src="https://iili.io/nSatIZN.md.png" alt="Fuljhuri">
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. In-Built Web Audio API Synthesizer (No MP3 Files Required) ---
        let audioCtx = null;
        let isMuted = false;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const activeLoops = {};

        function createNoiseBuffer() {
            initAudioContext();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        let sharedNoiseBuffer = null;
        function getNoiseBuffer() {
            if (!sharedNoiseBuffer) sharedNoiseBuffer = createNoiseBuffer();
            return sharedNoiseBuffer;
        }

        function playFx(name) {
            if (isMuted) return;
            initAudioContext();
            const now = audioCtx.currentTime;

            if (name === 'bomb') {
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(25, now + 0.35);
                oscGain.gain.setValueAtTime(1.2, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);

                const noise = audioCtx.createBufferSource();
                noise.buffer = getNoiseBuffer();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(1.0, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.45);
            }
            else if (name === 'skyshot_launch') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(90, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.16);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }
            else if (name === 'skyshot_blast' || name === 'rocket_blast') {
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.4);
                oscGain.gain.setValueAtTime(0.9, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.45);

                const noise = audioCtx.createBufferSource();
                noise.buffer = getNoiseBuffer();
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1600, now);
                filter.Q.setValueAtTime(2.5, now);
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.8, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.65);
            }
            else if (name === 'rocket_launch') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(1650, now + 0.7);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.35, now + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.7);
            }
            else if (name === 'tubri') {
                stopFx('tubri');
                const noise = audioCtx.createBufferSource();
                noise.buffer = getNoiseBuffer();
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2600, now);
                filter.Q.setValueAtTime(3.0, now);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.3);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
                activeLoops['tubri'] = { source: noise, gain: gain };
            }
            else if (name === 'chorki') {
                stopFx('chorki');
                const osc = audioCtx.createOscillator();
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                lfo.frequency.setValueAtTime(7.5, now);
                lfoGain.gain.setValueAtTime(140, now);
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                lfo.start(now);
                osc.start(now);
                activeLoops['chorki'] = { source: osc, lfo: lfo, gain: gain };
            }
            else if (name === 'fuljhuri') {
                stopFx('fuljhuri');
                const noise = audioCtx.createBufferSource();
                noise.buffer = getNoiseBuffer();
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(4500, now);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, now);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
                activeLoops['fuljhuri'] = { source: noise, gain: gain };
            }
        }

        function stopFx(name) {
            if (activeLoops[name] && audioCtx) {
                const item = activeLoops[name];
                const now = audioCtx.currentTime;
                if (item.gain) {
                    item.gain.gain.setValueAtTime(item.gain.gain.value, now);
                    item.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                }
                setTimeout(() => {
                    try {
                        if (item.source) item.source.stop();
                        if (item.lfo) item.lfo.stop();
                    } catch(e) {}
                    delete activeLoops[name];
                }, 160);
            }
        }

        let ambientActive = false;
        function startAmbientSynth() {
            if (isMuted || ambientActive) return;
            initAudioContext();
            ambientActive = true;

            function scheduleDistantBoom() {
                if (!ambientActive || isMuted) return;
                const delay = 3500 + Math.random() * 4500;
                setTimeout(() => {
                    if (!ambientActive || isMuted) return;
                    initAudioContext();
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(60, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
                    gain.gain.setValueAtTime(0.05 + Math.random() * 0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                    scheduleDistantBoom();
                }, delay);
            }
            scheduleDistantBoom();
        }

        class SkyLantern {
            constructor() {

                this.vy = -1.4 - Math.random() * 0.6;

            }
            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.vx *= 0.994;
                this.size *= 0.9991;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = 0.94;

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x - this.size / 2, this.y - this.size, this.size, this.size * 1.3, [6, 6, 12, 12]);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.size * 0.15, this.size * 0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 8. Lag-Free Canvas Particle Engine ---
        const container = document.getElementById('appContainer');
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let shockwaves = [];
        let flashAlpha = 0;
        let skyFireworkBanner = null;

        class RealisticParticle {
            constructor(x, y, vx, vy, color, size, decay, gravity = 0.08) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.alpha = 1;
                this.decay = decay;
                this.gravity = gravity;
            }
            update() {
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.alpha -= this.decay;
                this.size *= 0.985;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);

                ctx.strokeStyle = this.color;
                ctx.lineWidth = Math.max(0.8, this.size);
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.4, this.size * 0.45), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, color, maxRadius = 90) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = 2;
                this.maxRadius = maxRadius;
                this.alpha = 0.8;
            }
            update() {
                this.radius += 5.5;
                this.alpha -= 0.04;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function triggerFlash(intensity = 0.45) {
            flashAlpha = Math.max(flashAlpha, intensity);
        }

        function createMassiveExplosion(x, y, count = 160, colors = ['#ffe066', '#ff5722', '#ff0055', '#00e5ff', '#ffffff'], gravity = 0.08, shock = true) {
            triggerFlash(0.5);
            if (shock) shockwaves.push(new Shockwave(x, y, colors[0], 100));

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 11 + 2.5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new RealisticParticle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color,
                    Math.random() * 2.8 + 1.2,
                    0.01 + Math.random() * 0.015,
                    gravity
                ));
            }
        }

        // --- 100% Crystal Clear HD Sky Text (No Pixelation, High Visibility) ---
        function spawnTextParticles(lines, cx, cy) {
            if (typeof lines === 'string') lines = [lines];

            skyFireworkBanner = {
                lines: lines,
                x: cx,
                y: cy,
                alpha: 1,
                decay: 0.0035,
                sparkles: []
            };

            for (let i = 0; i < 75; i++) {
                skyFireworkBanner.sparkles.push({
                    ox: (Math.random() - 0.5) * (canvas.width * 0.82),
                    oy: (Math.random() - 0.5) * 65,
                    size: Math.random() * 1.8 + 0.8,
                    speed: Math.random() * 0.08 + 0.04,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function spawnTouchSparkle(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            const tx = clientX - rect.left;
            const ty = clientY - rect.top;
            const sparkColors = ['#ffd700', '#fff', '#ff9900', '#ff3366', '#00e5ff'];
            for (let k = 0; k < 2; k++) {
                particles.push(new RealisticParticle(
                    tx + (Math.random() - 0.5) * 8,
                    ty + (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    sparkColors[Math.floor(Math.random() * sparkColors.length)],
                    Math.random() * 2 + 1,
                    0.05,
                    0.03
                ));
            }
        }

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches[0]) {
                spawnTouchSparkle(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                spawnTouchSparkle(e.clientX, e.clientY);
            }
        });

        function animLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 230, 180, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashAlpha *= 0.86;
                if (flashAlpha < 0.01) flashAlpha = 0;
            }

            for (let i = skyLanterns.length - 1; i >= 0; i--) {
                const sl = skyLanterns[i];
                sl.update();
                sl.draw();
                if (sl.y < -60 || sl.x < -60) skyLanterns.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i];
                s.update();
                s.draw();
                if (s.alpha <= 0) shockwaves.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Crystal Clear Text Render
            if (skyFireworkBanner && skyFireworkBanner.alpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, skyFireworkBanner.alpha);

                const lines = skyFireworkBanner.lines;
                let maxLen = Math.max(...lines.map(l => l.length));
                let fontSize = Math.floor(Math.min(canvas.width / (maxLen * 0.72), 34));
                fontSize = Math.max(20, Math.min(34, fontSize));

                ctx.font = `900 ${fontSize}px 'Poppins', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const lineHeight = fontSize * 1.35;
                const totalH = (lines.length - 1) * lineHeight;
                const startY = skyFireworkBanner.y - totalH / 2;

                lines.forEach((line, idx) => {
                    const ly = startY + idx * lineHeight;

                    // Layer 1: Orange Aura
                    ctx.strokeStyle = '#ff7700';
                    ctx.lineWidth = 6;
                    ctx.strokeText(line, skyFireworkBanner.x, ly);

                    // Layer 2: Golden Spark
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.strokeText(line, skyFireworkBanner.x, ly);

                    // Layer 3: Solid White Sparkler Core
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(line, skyFireworkBanner.x, ly);
                });

                // Soft Twinkling Sparkles
                skyFireworkBanner.sparkles.forEach(sp => {
                    const flicker = Math.sin(Date.now() * sp.speed + sp.phase);
                    if (flicker > 0) {
                        ctx.fillStyle = flicker > 0.5 ? '#ffffff' : '#ffd700';
                        ctx.beginPath();
                        ctx.arc(skyFireworkBanner.x + sp.ox, skyFireworkBanner.y + sp.oy, sp.size * flicker, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                ctx.restore();

                skyFireworkBanner.alpha -= skyFireworkBanner.decay;
                if (skyFireworkBanner.alpha <= 0) skyFireworkBanner = null;
            }

            requestAnimationFrame(animLoop);
        }
        animLoop();

        // Exact Coordinates Helper
        let activeStates = {};

        function getExactElementPos(el) {
            const cRect = container.getBoundingClientRect();
            const rect = el.getBoundingClientRect();
            return {
                x: (rect.left - cRect.left) + rect.width / 2,
                y: (rect.top - cRect.top) + rect.height / 2,
                topY: (rect.top - cRect.top),
                bottomY: (rect.bottom - cRect.top)
            };
        }

        function handleCrackerClick(type) {
            if (activeStates[type]) return;
            const el = document.getElementById('item-' + type);
            const pos = getExactElementPos(el);

            trackCrackerProgress(type);

            if (type === 'bomb') {
                animateBomb(el, pos.x, pos.y);
            } else if (type === 'tubri') {
                animateTubri(el, pos.x, pos.topY);
            } else if (type === 'chorki') {
                animateChorki(el);
            } else if (type === 'skyshot') {
                animateSkyShot(el, pos.x, pos.topY);
            } else if (type === 'rocket') {
                animateRocket(el, pos.x, pos.topY);
            } else if (type === 'fuljhuri') {
                animateFuljhuri();
            }
        }

        // 1. Bomb
        function animateBomb(el, startX, startY) {
            activeStates['bomb'] = true;
            triggerHaptic([30]);
            const offsetX = (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random() * 50);
            const targetX = startX + offsetX;
            const targetY = startY - (130 + Math.random() * 40);

            el.style.transition = 'all 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
            el.style.transform = `translate(${offsetX}px, ${targetY - startY}px) rotate(${offsetX * 4}deg) scale(0.9)`;

            const fuseInterval = setInterval(() => {
                const curPos = getExactElementPos(el);
                particles.push(new RealisticParticle(
                    curPos.x,
                    curPos.topY,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    '#ffd700',
                    2,
                    0.05,
                    0.02
                ));
            }, 30);

            setTimeout(() => {
                clearInterval(fuseInterval);
                el.style.visibility = 'hidden';
                playFx('bomb');
                triggerHaptic([180]);
                createMassiveExplosion(
                    targetX, targetY, 160, 
                    ['#ff3300', '#ff9900', '#ffd700', '#ffffff', '#ffee55'], 
                    0.13, 
                    true
                );

                setTimeout(() => {
                    el.style.transition = 'none';
                    el.style.transform = 'none';
                    el.style.visibility = 'visible';
                    activeStates['bomb'] = false;
                }, 1300);
            }, 650);
        }

        // 2. Tubri
        function animateTubri(el, topX, topY) {
            activeStates['tubri'] = true;
            playFx('tubri');
            triggerHaptic([60, 40, 60]);
            const startTime = Date.now();
            const duration = 3800;
            const colors = ['#fff', '#ffd700', '#ffaa00', '#ff3300', '#ff00ea'];

            const interval = setInterval(() => {
                const currentPos = getExactElementPos(el);
                const curX = currentPos.x;
                const curY = currentPos.topY + 6;

                const elapsed = Date.now() - startTime;
                if (elapsed > duration) {
                    clearInterval(interval);
                    stopFx('tubri');
                    activeStates['tubri'] = false;
                    return;
                }
                const progress = elapsed / duration;
                const heightPower = progress < 0.6 ? (progress / 0.6) : ((1 - progress) / 0.4);
                const sparkCount = 5 + Math.floor(heightPower * 6);

                for (let i = 0; i < sparkCount; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.65;
                    const speed = 5 + heightPower * 11 + Math.random() * 3.5;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new RealisticParticle(
                        curX, curY,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        color,
                        Math.random() * 2.2 + 1,
                        0.03 + Math.random() * 0.02,
                        0.24
                    ));
                }
            }, 35);
        }

        // 3. Chorki
        function animateChorki(el) {
            activeStates['chorki'] = true;
            playFx('chorki');
            triggerHaptic([40, 30, 40, 30]);
            let currentX = 0;
            let currentY = 0;
            let rot = 0;
            const startTime = Date.now();
            const duration = 4800;

            const loop = setInterval(() => {
                const elapsed = Date.now() - startTime;
                if (elapsed > duration) {
                    clearInterval(loop);
                    stopFx('chorki');
                    el.style.transition = 'transform 0.5s ease';
                    el.style.transform = 'rotateX(48deg)';
                    setTimeout(() => {
                        activeStates['chorki'] = false;
                    }, 500);
                    return;
                }

                rot += 55;
                currentX += (Math.random() - 0.5) * 16;
                currentY += (Math.random() - 0.5) * 8;
                currentX = Math.max(-90, Math.min(90, currentX));
                currentY = Math.max(-35, Math.min(35, currentY));

                el.style.transform = `translate(${currentX}px, ${currentY}px) rotateX(48deg) rotate(${rot}deg) scale(1.08)`;

                const curPos = getExactElementPos(el);
                const colors = ['#00e5ff', '#ff007f', '#ffd700', '#00ff66', '#ffffff', '#ff9100'];

                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 4;
                    particles.push(new RealisticParticle(
                        curPos.x, curPos.y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        colors[Math.floor(Math.random() * colors.length)],
                        Math.random() * 2.5 + 1.2,
                        0.035,
                        0.06
                    ));
                }
            }, 28);
        }

        // 4. Sky Shot
        function animateSkyShot(el, startX, startY) {
            activeStates['skyshot'] = true;
            let shotCount = 0;

            function fireOneShot() {
                if (shotCount >= 4) {
                    activeStates['skyshot'] = false;
                    return;
                }
                shotCount++;
                playFx('skyshot_launch');
                triggerHaptic([40]);

                const currentPos = getExactElementPos(el);
                let currentY = currentPos.topY;
                let currentX = currentPos.x + (Math.random() - 0.5) * 12;
                let targetY = canvas.height * (0.16 + Math.random() * 0.12);

                const trailInterval = setInterval(() => {
                    currentY -= 22;
                    
                    for (let k = 0; k < 2; k++) {
                        particles.push(new RealisticParticle(
                            currentX + (Math.random() - 0.5) * 3,
                            currentY,
                            (Math.random() - 0.5) * 2,
                            Math.random() * 2 + 1,
                            '#ffd700',
                            2.5,
                            0.06,
                            0.02
                        ));
                    }

                    if (currentY <= targetY) {
                        clearInterval(trailInterval);
                        playFx('skyshot_blast');
                        triggerHaptic([110]);
                        if (shotCount < 4) {
                            createMassiveExplosion(
                                currentX, currentY, 160, 
                                ['#ff0055', '#00e5ff', '#ffd700', '#ff7700', '#ffffff', '#76ff03'], 
                                0.08, 
                                true
                            );
                            setTimeout(fireOneShot, 750);
                        } else {
                            createMassiveExplosion(
                                currentX, currentY, 200, 
                                ['#ffd700', '#ff0033', '#ffffff', '#ff9900', '#ffe600'], 
                                0.07, 
                                true
                            );
                            const customName = document.getElementById('skyNameInput').value.trim();
                            const lines = customName ? ["HAPPY DIWALI", customName.toUpperCase()] : ["HAPPY DIWALI", "2026"];
                            spawnTextParticles(lines, canvas.width / 2, canvas.height * 0.25);
                            setTimeout(fireOneShot, 1200);
                        }
                    }
                }, 20);
            }

            fireOneShot();
        }

        // 5. Rocket
        function animateRocket(el, startX, startY) {
            activeStates['rocket'] = true;
            const originPos = getExactElementPos(el);
            el.style.visibility = 'hidden';
            playFx('rocket_launch');
            triggerHaptic([50]);

            let curX = originPos.x;
            let curY = originPos.topY;
            let vx = (Math.random() - 0.5) * 5;
            let vy = -18;

            const rocketFlight = setInterval(() => {
                curX += vx;
                curY += vy;
                vx += (Math.random() - 0.5) * 2;

                for (let k = 0; k < 3; k++) {
                    particles.push(new RealisticParticle(
                        curX, curY + 12,
                        (Math.random() - 0.5) * 3,
                        Math.random() * 4 + 2,
                        '#ff9900',
                        2.8,
                        0.05,
                        0.05
                    ));
                }

                if (curY <= canvas.height * 0.20) {
                    clearInterval(rocketFlight);
                    playFx('rocket_blast');
                    triggerHaptic([140]);
                    createMassiveExplosion(
                        curX, curY, 180, 
                        ['#00e5ff', '#ff0055', '#ffe600', '#76ff03', '#ffffff', '#e040fb'], 
                        0.07, 
                        true
                    );
                    setTimeout(() => {
                        el.style.visibility = 'visible';
                        activeStates['rocket'] = false;
                    }, 1100);
                }
            }, 22);
        }

        // 6. Fuljhuri Video Animation
        function animateFuljhuri() {
            activeStates['fuljhuri'] = true;
            const fVideo = document.getElementById('fuljhuriVideo');
            const items = document.getElementById('crackersContainer');
            if (!fVideo) return;

            if (items) items.style.opacity = '0';

            fVideo.style.display = 'block';
            fVideo.currentTime = 0;
            
            setTimeout(() => {
                fVideo.classList.add('active');
            }, 30);

            playFx('fuljhuri');
            triggerHaptic([30, 30, 30]);

            fVideo.play().catch(() => {});

            fVideo.onended = () => {
                fVideo.classList.remove('active');
                stopFx('fuljhuri');

                setTimeout(() => {
                    fVideo.style.display = 'none';
                    if (items) items.style.opacity = '1';
                    activeStates['fuljhuri'] = false;
                }, 600);
            };
        }
    </script>
